# One origin for the whole app: /api/* → API, everything else → web.
# Same origin means no CORS, and cookies just work.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent streams Server-Sent Events: pass every token through immediately
        # and keep long-running streams open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
