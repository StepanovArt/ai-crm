# PostgreSQL as a StatefulSet: a stable identity and its own persistent volume, so data survives
# pod restarts and rescheduling. Fine for learning; in production prefer a managed database.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: the DNS name "postgres" resolves straight to the database pod
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: halo
            - name: POSTGRES_DB
              value: halo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: halo-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory: some volume types put a lost+found folder at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "halo", "-d", "halo"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # One PersistentVolumeClaim per replica, created from this template.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
